<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Digital Business Card | JC Labs</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="config.js"></script>
  <script src="vcard.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/+esm"></script>
  <style>
    body { background-color: #fbf9fa; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="font-body-md text-on-surface">

<!-- Header -->
<header class="bg-white sticky top-0 z-[100] border-b border-[#E2E8F0] shadow-[0px_10px_30px_rgba(26,43,60,0.05)]">
  <div class="flex justify-between items-center w-full px-6 py-4 max-w-[1280px] mx-auto">
    <div class="flex items-center gap-4">
      <a href="index.html" class="text-xl font-bold text-[#1A2B3C] font-['Manrope'] tracking-tight">JC Labs</a>
    </div>
    <div class="flex gap-6">
      <a href="index.html" class="text-[#1A2B3C] hover:text-[#00B4D8] transition-colors">Home</a>
      <a href="team.html" class="text-[#1A2B3C] hover:text-[#00B4D8] transition-colors">Team</a>
      <a href="index.html#contact" class="text-[#1A2B3C] hover:text-[#00B4D8] transition-colors">Contact</a>
    </div>
  </div>
</header>

<main class="max-w-[1280px] mx-auto px-6">

  <!-- Loading State -->
  <div id="loading" class="py-20 md:py-32">
    <div class="max-w-2xl mx-auto text-center">
      <p class="text-on-surface-variant">Loading card...</p>
    </div>
  </div>

  <!-- Card Not Found State -->
  <div id="not-found" class="hidden py-20 md:py-32">
    <div class="max-w-2xl mx-auto text-center">
      <span class="material-symbols-outlined text-6xl text-gray-300 block mb-4">folder_off</span>
      <h1 class="font-h1 text-2xl text-primary mb-2">Card Not Found</h1>
      <p class="text-on-surface-variant mb-6">This card doesn't exist or has been deleted.</p>
      <a href="card-generator.html" class="bg-[#00B4D8] text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 inline-block">
        Create Your Own Card
      </a>
    </div>
  </div>

  <!-- Card Display -->
  <div id="card-display" class="hidden py-20 md:py-32">
    <div class="max-w-2xl mx-auto">
      <div class="text-center mb-12">
        <h1 id="card-name" class="font-h1 text-4xl md:text-5xl text-primary mb-4">—</h1>
        <p id="card-title" class="text-lg text-on-surface-variant">—</p>
        <p id="card-company" class="text-sm text-on-surface-variant">—</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

        <!-- Contact Information -->
        <div class="space-y-6">
          <div class="bg-white border border-[#E2E8F0] rounded-2xl p-8 shadow-[0px_10px_30px_rgba(26,43,60,0.05)]">
            <h2 class="font-h3 text-h3 text-primary mb-8">Contact Information</h2>
            <div id="contact-info" class="space-y-6">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Download vCard Button -->
          <button
            onclick="downloadCardVCF()"
            class="w-full bg-[#00B4D8] text-white px-6 py-4 rounded-lg font-bold shadow-[0px_10px_30px_rgba(0,180,216,0.2)] hover:opacity-90 transition-all flex items-center justify-center gap-3"
          >
            <span class="material-symbols-outlined">download</span>
            Download Contact Card
          </button>
        </div>

        <!-- QR Code -->
        <div class="space-y-6">
          <div class="bg-white border border-[#E2E8F0] rounded-2xl p-8 shadow-[0px_10px_30px_rgba(26,43,60,0.05)] flex flex-col items-center justify-center">
            <div class="mb-6">
              <p class="text-sm text-on-surface-variant text-center mb-4" id="qr-subtitle">Scan to save contact</p>
              <div id="qr-container" style="display: flex; justify-content: center;"></div>
            </div>
            <div class="w-full space-y-2">
              <button
                onclick="downloadQRCode('png')"
                class="w-full bg-primary text-white px-6 py-3 rounded-lg font-semibold hover:bg-slate-800 transition-all flex items-center justify-center gap-2"
              >
                <span class="material-symbols-outlined">image</span>
                Download QR (PNG)
              </button>
              <button
                onclick="downloadQRCode('svg')"
                class="w-full bg-gray-200 text-primary px-6 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-all flex items-center justify-center gap-2"
              >
                <span class="material-symbols-outlined">image</span>
                Download QR (SVG)
              </button>
            </div>
          </div>

          <!-- Edit/Delete Link Info -->
          <p id="manage-info" class="hidden text-xs text-on-surface-variant text-center">
            <a href="#" id="manage-link" class="text-[#00B4D8] underline">Edit or delete this card</a>
          </p>
        </div>

      </div>
    </div>
  </div>

</main>

<!-- Footer -->
<footer class="bg-[#1A2B3C] text-white py-16 px-6 mt-20">
  <div class="max-w-[1280px] mx-auto text-center">
    <p class="text-on-primary-container text-sm mb-4">
      Free Digital Business Card
    </p>
    <p>© 2024 JC Labs. All rights reserved.</p>
  </div>
</footer>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/+esm';

  const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
  let currentCard = null;
  let currentQRMode = 'vcard';

  async function loadCard() {
    try {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('id');

      if (!slug) {
        showNotFound();
        return;
      }

      const { data, error } = await supabase
        .from('public_vcards')
        .select('*')
        .eq('slug', slug)
        .single();

      if (error || !data) {
        showNotFound();
        return;
      }

      // Check if card is deleted or expired
      if (data.deleted_at || (data.expires_at && new Date(data.expires_at) < new Date())) {
        showNotFound();
        return;
      }

      currentCard = data;
      currentQRMode = data.qr_mode;
      renderCard();

    } catch (err) {
      console.error('Error loading card:', err);
      showNotFound();
    }
  }

  function renderCard() {
    const card = currentCard;

    // Set page title and meta
    document.title = `${card.full_name} - Digital Business Card | JC Labs`;

    // Header
    document.getElementById('card-name').textContent = card.full_name;
    document.getElementById('card-title').textContent = card.title || '—';
    document.getElementById('card-company').textContent = card.company || '—';

    // Contact Info
    const contactInfo = document.getElementById('contact-info');
    contactInfo.innerHTML = '';

    if (card.phone) {
      contactInfo.innerHTML += `
        <div class="flex items-start gap-4">
          <span class="material-symbols-outlined text-[#00B4D8] text-2xl flex-shrink-0">phone</span>
          <div>
            <p class="text-xs font-label-caps text-on-surface-variant uppercase tracking-wider mb-1">Phone</p>
            <a href="tel:${card.phone}" class="text-primary font-semibold hover:text-[#00B4D8] transition-colors">
              ${escapeHtml(card.phone)}
            </a>
          </div>
        </div>
      `;
    }

    if (card.email) {
      contactInfo.innerHTML += `
        <div class="flex items-start gap-4">
          <span class="material-symbols-outlined text-[#00B4D8] text-2xl flex-shrink-0">mail</span>
          <div>
            <p class="text-xs font-label-caps text-on-surface-variant uppercase tracking-wider mb-1">Email</p>
            <a href="mailto:${card.email}" class="text-primary font-semibold hover:text-[#00B4D8] transition-colors">
              ${escapeHtml(card.email)}
            </a>
          </div>
        </div>
      `;
    }

    if (card.website) {
      contactInfo.innerHTML += `
        <div class="flex items-start gap-4">
          <span class="material-symbols-outlined text-[#00B4D8] text-2xl flex-shrink-0">language</span>
          <div>
            <p class="text-xs font-label-caps text-on-surface-variant uppercase tracking-wider mb-1">Website</p>
            <a href="${escapeHtml(card.website)}" target="_blank" rel="noopener noreferrer" class="text-primary font-semibold hover:text-[#00B4D8] transition-colors break-all">
              ${escapeHtml(card.website.replace(/^https?:\/\//, ''))}
            </a>
          </div>
        </div>
      `;
    }

    if (card.wechat_id) {
      contactInfo.innerHTML += `
        <div class="flex items-start gap-4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-6 h-6 flex-shrink-0" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9.5"/>
            <path d="M8 11c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2h-1l-2 2v-2h-1c-1.1 0-2-.9-2-2v-2z"/>
            <circle cx="9" cy="10.5" r="0.5" fill="#00B4D8"/>
            <circle cx="15" cy="10.5" r="0.5" fill="#00B4D8"/>
          </svg>
          <div>
            <p class="text-xs font-label-caps text-on-surface-variant uppercase tracking-wider mb-1">WeChat</p>
            <p class="text-primary font-semibold">${escapeHtml(card.wechat_id)}</p>
          </div>
        </div>
      `;
    }

    if (card.whatsapp_number) {
      contactInfo.innerHTML += `
        <div class="flex items-start gap-4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#00B4D8" class="w-6 h-6 flex-shrink-0">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
          <div>
            <p class="text-xs font-label-caps text-on-surface-variant uppercase tracking-wider mb-1">WhatsApp</p>
            <a href="https://wa.me/${card.whatsapp_number.replace(/\D/g, '')}" target="_blank" rel="noopener noreferrer" class="text-primary font-semibold hover:text-[#00B4D8] transition-colors">
              ${escapeHtml(card.whatsapp_number)}
            </a>
          </div>
        </div>
      `;
    }

    // Render QR code
    renderQRCode();

    // Show card and hide loading
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('card-display').classList.remove('hidden');
  }

  function renderQRCode() {
    const container = document.getElementById('qr-container');
    container.innerHTML = '';

    try {
      QRCode.toCanvas(container, currentCard.qr_payload, {
        width: 256,
        margin: 2,
        color: { dark: '#000000', light: '#FFFFFF' }
      }, (error) => {
        if (error) console.error('QR generation error:', error);
      });
    } catch (e) {
      console.error('QR error:', e);
    }

    // Update subtitle
    const subtitle = document.getElementById('qr-subtitle');
    if (currentQRMode === 'url') {
      subtitle.textContent = 'Scan to view this card online';
    } else {
      subtitle.textContent = 'Scan to save contact';
    }
  }

  function downloadCardVCF() {
    if (!currentCard) return;

    const vcard = buildVCardText({
      fullName: currentCard.full_name,
      title: currentCard.title,
      company: currentCard.company,
      email: currentCard.email,
      phone: currentCard.phone,
      website: currentCard.website,
      wechatId: currentCard.wechat_id,
      whatsappNumber: currentCard.whatsapp_number,
    });

    const filename = sanitizeFilename(currentCard.full_name);
    downloadVCard(filename, vcard);
  }

  async function downloadQRCode(format) {
    const container = document.getElementById('qr-container');
    const canvas = container.querySelector('canvas');

    if (!canvas) return;

    if (format === 'png') {
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = `${sanitizeFilename(currentCard.full_name)}-QR.png`;
      link.click();
    } else if (format === 'svg') {
      // SVG generation from QR code library
      try {
        const svgString = await QRCode.toString(currentCard.qr_payload, {
          width: 256,
          margin: 2,
          type: 'image/svg+xml',
          color: { dark: '#000000', light: '#FFFFFF' }
        });

        const blob = new Blob([svgString], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${sanitizeFilename(currentCard.full_name)}-QR.svg`;
        link.click();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('SVG download not supported by your browser');
      }
    }
  }

  function showNotFound() {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('not-found').classList.remove('hidden');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Load card on page load
  loadCard();
</script>

</body>
</html>
